<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Florencia Florist — Interactive Caoimhe Desk</title>
<style>
:root{
  --asset-root:"https://raw.githubusercontent.com/caoimhewinc/Florencia-Florist/main/assets/";
  --lift:-10px;
  --lift-scale:1.015;
  --soft-lift:-5px;
  --soft-scale:1.006;
  --logo-y:-18%;
  --logo-scale:.46;
  --logo-hover-scale:.475;
  --ease:cubic-bezier(.19,1,.22,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#18130f}
body{overflow-x:hidden;font-family:Georgia,serif}
img{display:block;user-select:none;-webkit-user-drag:none}

.caoimhe-desk{
  position:relative;
  display:grid;
  place-items:center;
  width:100%;
  min-height:100svh;
  padding:28px;
  overflow:hidden;
  isolation:isolate;
  background:radial-gradient(circle at 50% 42%,rgba(255,235,190,.25),transparent 40%),#e9dfca;
}
.caoimhe-desk::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-3;
  opacity:.3;
  background:
    linear-gradient(rgba(246,240,226,.85),rgba(233,222,202,.9)),
    repeating-linear-gradient(90deg,rgba(92,106,72,.08) 0 1px,transparent 1px 190px);
}
.caoimhe-desk::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:50;
  pointer-events:none;
  box-shadow:inset 0 0 110px rgba(46,27,14,.22);
}

.desk-frame{
  position:relative;
  width:min(1500px,96vw);
  aspect-ratio:3/2;
  overflow:hidden;
  background:#5a4032;
  box-shadow:0 35px 85px rgba(37,21,11,.36),inset 0 3px rgba(255,255,255,.2);
  transform:translateZ(0);
}

.desk-layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:fill;
  pointer-events:none;
  transform:translateY(0) scale(1);
  transform-origin:center;
  transition:transform .55s var(--ease),filter .45s ease,opacity .45s ease;
  will-change:transform,filter;
}

/* Materials */
.layer-bg{z-index:0}
.layer-stain{opacity:.82;mix-blend-mode:multiply;filter:sepia(.1) saturate(.78) brightness(.94)}
.layer-paper{filter:sepia(.08) saturate(.92) brightness(.985) drop-shadow(8px 12px 10px rgba(27,15,8,.22))}
.layer-flower{filter:sepia(.04) saturate(.92) brightness(.96) drop-shadow(4px 7px 6px rgba(27,14,7,.18))}
.layer-metal{filter:sepia(.08) saturate(.86) brightness(.94) drop-shadow(7px 11px 9px rgba(22,11,6,.25))}
.layer-fabric{filter:sepia(.04) saturate(.82) brightness(.98) drop-shadow(3px 6px 6px rgba(30,17,8,.15))}
.layer-logo{filter:sepia(.08) saturate(.88) brightness(.88) contrast(1.04) drop-shadow(0 5px 6px rgba(0,0,0,.18))}

/* Stacking */
#wood{z-index:0}
#coffee{z-index:1}
#paper{z-index:4}
#hand02{z-index:5}
#lace{z-index:6}
#dried{z-index:7}
#envelope{z-index:8}
#purple{z-index:9;}
#clover{z-index:3;transform:translateY(12px);filter:sepia(.22) saturate(.72) brightness(.88);}
#redRose{z-index:10}
#pinkRose{z-index:11}
#wax{z-index:12}
#petals{z-index:13}
#hand01{z-index:14}
#blankTag{z-index:15}
#floralTag{z-index:16}
#pressed{z-index:17}
#grid{z-index:18}
#watch{z-index:19}
#quill{z-index:20}
#key{z-index:21}
#logo{
  z-index:22;
  transform:translateY(var(--logo-y)) scale(var(--logo-scale));
  transform-origin:center;
}

/* Hover states */
.desk-layer.is-hovered{
  transform:translateY(var(--lift)) scale(var(--lift-scale));
  filter:sepia(.03) saturate(.98) brightness(1.045) drop-shadow(10px 18px 14px rgba(24,12,6,.34));
}
.desk-layer.is-soft-hovered{
  transform:translateY(var(--soft-lift)) scale(var(--soft-scale));
  filter:sepia(.04) saturate(.94) brightness(1.025) drop-shadow(7px 13px 11px rgba(24,12,6,.25));
}
#logo.is-hovered{
  transform:translateY(calc(var(--logo-y) + var(--lift))) scale(var(--logo-hover-scale));
}

/* Invisible hover zones */
.hitbox{
  position:absolute;
  z-index:60;
  margin:0;
  padding:0;
  border:0;
  border-radius:18px;
  outline:none;
  background:transparent;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  -webkit-tap-highlight-color:transparent;
}
.hitbox::after{
  content:"";
  position:absolute;
  inset:8%;
  z-index:-1;
  border-radius:50%;
  background:rgba(255,226,169,.16);
  filter:blur(24px);
  opacity:0;
  transition:opacity .35s ease;
}
.hitbox:hover::after,.hitbox:focus-visible::after{opacity:1}

/* Hitboxes based on the original 1500×1000 Canva canvas */
.hit-logo{left:27%;top:12%;width:46%;height:30%}
.hit-paper{left:18%;top:5%;width:64%;height:84%}
.hit-envelope{left:0;top:0;width:25.5%;height:33%}
.hit-dried{left:0;top:7%;width:25%;height:78%}
.hit-lace{left:0;top:39%;width:20%;height:61%}
.hit-red{left:0;top:63%;width:17%;height:28%}
.hit-pink{left:0;top:75%;width:22%;height:25%}
.hit-purple{left:21%;top:0;width:10%;height:21%}
.hit-clover{left:29%;top:0;width:13%;height:15%}
.hit-key{left:60%;top:0;width:18%;height:19%}
.hit-coffee{right:0;top:0;width:27%;height:17%}
.hit-pressed{right:0;top:6%;width:25%;height:55%}
.hit-blank-tag{right:9%;top:29%;width:14%;height:37%}
.hit-floral-tag{right:0;top:31%;width:14%;height:36%}
.hit-quill{right:0;top:39%;width:19%;height:48%}
.hit-grid{right:0;bottom:0;width:31%;height:45%}
.hit-watch{right:0;bottom:0;width:15%;height:30%}
.hit-hand01{left:53%;bottom:0;width:25%;height:31%}
.hit-hand02{left:9%;bottom:0;width:18%;height:28%}
.hit-petals{left:25%;bottom:0;width:29%;height:31%}
.hit-wax{left:0;top:12%;width:6%;height:13%}

.desk-light{
  position:absolute;
  z-index:45;
  width:360px;
  height:360px;
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,229,174,.13),transparent 70%);
  transition:opacity .25s;
}
.desk-frame:hover .desk-light{opacity:1}

.desk-hint{
  position:absolute;
  left:50%;
  bottom:12px;
  z-index:70;
  margin:0;
  color:rgba(244,226,191,.76);
  font-size:11px;
  font-style:italic;
  letter-spacing:.09em;
  text-shadow:0 2px 5px rgba(22,12,7,.8);
  pointer-events:none;
  transform:translateX(-50%);
}

@media(max-width:760px){
  :root{
    --lift:-7px;
    --lift-scale:1.01;
    --soft-lift:-3px;
    --soft-scale:1.003;
  }
  .caoimhe-desk{min-height:auto;padding:0}
  .desk-frame{width:100vw}
  .desk-hint{bottom:6px;font-size:9px}
}
@media(hover:none){
  .hitbox{cursor:default}
  .desk-layer.is-hovered,
  .desk-layer.is-soft-hovered{filter:none}
}
@media(prefers-reduced-motion:reduce){
  .desk-layer,.hitbox::after{transition:none!important}
}
</style>
</head>
<body>

<section class="caoimhe-desk" aria-label="Caoimhe Winchester's work desk">
  <div class="desk-frame" id="deskFrame">
    <div class="desk-light" id="deskLight"></div>
    <div id="layers"></div>
    <div id="hitboxes"></div>
    <p class="desk-hint">Move thy hand gently across the table.</p>
  </div>
</section>

<script>
(() => {
  const ASSET_ROOT="https://raw.githubusercontent.com/caoimhewinc/Florencia-Florist/main/assets/";

  const layers=[
    ["wood","wood-desk.png","layer-bg",""],
    ["coffee","coffee-ring-stain.png","layer-stain",""],
    ["paper","aged-paper.png","layer-paper","Aged parchment"],
    ["hand02","handwritten-note02.png","layer-paper",""],
    ["lace","lace-ribbon.png","layer-fabric",""],
    ["dried","dried-flowers.png","layer-flower",""],
    ["envelope","envelope-corner.png","layer-paper","Vintage envelope"],
    ["purple","purple-columbine.png","layer-flower",""],
    ["clover","four-leaf-clover.png","layer-flower",""],
    ["redRose","red-rose.png","layer-flower",""],
    ["pinkRose","pink-rose.png","layer-flower",""],
    ["wax","wax-seal.png","layer-metal",""],
    ["petals","rose-petals.png","layer-flower",""],
    ["hand01","handwritten-note.png","layer-paper",""],
    ["blankTag","blank-tag.png","layer-paper",""],
    ["floralTag","floral-tag.png","layer-paper",""],
    ["pressed","pressed-flower.png","layer-flower",""],
    ["grid","grid-notebook.png","layer-paper",""],
    ["watch","pocket-watch.png","layer-metal","Pocket watch"],
    ["quill","feather-quill.png","layer-metal","Feather quill"],
    ["key","antique-key.png","layer-metal","Antique key"],
    ["logo","Florencia-Florist-Logo.png","layer-logo","Florencia Florist"]
  ];

  const hitboxes=[
    ["hit-logo","logo","Florencia Florist logo"],
    ["hit-paper","paper","Aged parchment","soft"],
    ["hit-envelope","envelope","Vintage envelope"],
    ["hit-dried","dried","Dried flowers","soft"],
    ["hit-lace","lace","Lace ribbon","soft"],
    ["hit-red","redRose","Red rose"],
    ["hit-pink","pinkRose","Pink rose"],
    ["hit-purple","purple","Purple columbine"],
    ["hit-clover","clover","Four leaf clover"],
    ["hit-key","key","Antique key"],
    ["hit-coffee","coffee","Coffee ring","soft"],
    ["hit-pressed","pressed","Pressed flower"],
    ["hit-blank-tag","blankTag","Blank tag"],
    ["hit-floral-tag","floralTag","Floral tag"],
    ["hit-quill","quill","Feather quill"],
    ["hit-grid","grid","Grid notebook"],
    ["hit-watch","watch","Pocket watch"],
    ["hit-hand01","hand01","Handwritten note"],
    ["hit-hand02","hand02","Handwritten note"],
    ["hit-petals","petals","Rose petals","soft"],
    ["hit-wax","wax","Wax seal"]
  ];

  const layerRoot=document.getElementById("layers");
  const hitboxRoot=document.getElementById("hitboxes");
  const frame=document.getElementById("deskFrame");
  const light=document.getElementById("deskLight");

  layerRoot.innerHTML=layers.map(([id,file,type,alt])=>
    `<img id="${id}" class="desk-layer ${type}" src="${ASSET_ROOT}${file}" alt="${alt}">`
  ).join("");

  hitboxRoot.innerHTML=hitboxes.map(([className,target,label,mode])=>
    `<button class="hitbox ${className}" data-target="${target}"${mode==="soft"?" data-soft":""} aria-label="${label}"></button>`
  ).join("");

  function toggleHover(hitbox,active){
    const target=document.getElementById(hitbox.dataset.target);
    if(!target)return;
    const className=hitbox.hasAttribute("data-soft")?"is-soft-hovered":"is-hovered";
    target.classList.toggle(className,active);
  }

  hitboxRoot.querySelectorAll(".hitbox").forEach(hitbox=>{
    hitbox.addEventListener("pointerenter",()=>toggleHover(hitbox,true));
    hitbox.addEventListener("pointerleave",()=>toggleHover(hitbox,false));
    hitbox.addEventListener("focus",()=>toggleHover(hitbox,true));
    hitbox.addEventListener("blur",()=>toggleHover(hitbox,false));
  });

  frame.addEventListener("pointermove",event=>{
    const rect=frame.getBoundingClientRect();
    light.style.left=`${event.clientX-rect.left}px`;
    light.style.top=`${event.clientY-rect.top}px`;
  });
})();
</script>
</body>
</html>
